apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-ip
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ezrizhu/puppy
    targetRevision: main
    path: manifests/cilium
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
