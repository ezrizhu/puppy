name: Build and publish warewulf image

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "docker/**"
      - ".github/workflows/warewulf.yaml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: docker/
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/warewulf:latest
          cache-from: type=gha,scope=warewulf
          cache-to: type=gha,mode=max,scope=warewulf
